# Port 8080 (inchangé)
server.port=8080
spring.application.name=api-gateway

# Filtre d'authentification (inchangé)
spring.cloud.gateway.default-filters[0]=AuthenticationFilter

#
# ---- MODIFICATION IMPORTANTE ICI ----
# Nous utilisons maintenant les noms de service Kubernetes (DNS interne)
#

spring.cloud.gateway.routes[0].id=service-utilisateurs
# Anciennement: http://localhost:8082
spring.cloud.gateway.routes[0].uri=http://service-utilisateurs:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=service-ressources
# Anciennement: http://localhost:8081
spring.cloud.gateway.routes[1].uri=http://service-ressources:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/ressources/**

spring.cloud.gateway.routes[2].id=service-reservations
# Anciennement: http://localhost:8083
spring.cloud.gateway.routes[2].uri=http://service-reservations:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/reservations/**