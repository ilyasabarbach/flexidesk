apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # L'adresse e-mail pour les notifications (expiration, etc.)
    email: ilyass.mambo@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    # On utilise le "HTTP-01 challenge"
    # K8s va prouver qu'il possède ailyes.com en créant un fichier temporaire
    - http01:
        ingress:
          class: traefik # L'ingress par défaut de K3s