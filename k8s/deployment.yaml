# --- Service Ressources ---
apiVersion: v1
kind: Service
metadata:
  name: service-ressources
spec:
  selector:
    app: service-ressources
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-ressources-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-ressources
  template:
    metadata:
      labels:
        app: service-ressources
    spec:
      containers:
      - name: service-ressources
        image: registry.gitlab.com/devops2255146/flexidesk-project/service-ressources:TAG_PLACEHOLDER
        ports:
        - containerPort: 8081
      
      # CORRECTION ICI: L'indentation est au niveau de "spec"
      imagePullSecrets:
      - name: gitlab-registry-creds
---
