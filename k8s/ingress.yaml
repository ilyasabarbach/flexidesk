apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flexidesk-ingress
spec:
  rules:
  - host: ailyes.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-react
            port:
              number: 80
              
  - host: www.ailyes.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-react
            port:
              number: 80