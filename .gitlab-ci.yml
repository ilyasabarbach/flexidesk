# 1. Ajout de la nouvelle étape "deploy"
stages:
  - build-and-push
  - deploy # Nouvelle étape

variables:
  # L'URL de votre registre (vous l'avez déjà)
  IMAGE_REGISTRY: "registry.gitlab.com/devops2255146/flexidesk-project"
  # Le tag (inchangé)
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  # L'IP de votre serveur (pour le remplacement)
  AWS_SERVER_IP: "13.51.121.181" 

before_script:
  - echo "Logging in to GitLab Container Registry..."
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# --- Tâche 1 : Build Service-Ressources ---
build-service-ressources:
  stage: build-and-push
  image: docker:24-git
  services:
    - docker:24-dind
  script:
    - docker build -t $IMAGE_REGISTRY/service-ressources:$IMAGE_TAG -f service-ressources/Dockerfile .
    - docker push $IMAGE_REGISTRY/service-ressources:$IMAGE_TAG

# --- Tâche 2 : Build Service-Utilisateurs ---
build-service-utilisateurs:
  stage: build-and-push
  image: docker:24-git
  services:
    - docker:24-dind
  script:
    - docker build -t $IMAGE_REGISTRY/service-utilisateurs:$IMAGE_TAG -f service-utilisateurs/Dockerfile .
    - docker push $IMAGE_REGISTRY/service-utilisateurs:$IMAGE_TAG

# --- Tâche 3 : Build Service-Reservations ---
build-service-reservations:
  stage: build-and-push
  image: docker:24-git
  services:
    - docker:24-dind
  script:
    - docker build -t $IMAGE_REGISTRY/service-reservations:$IMAGE_TAG -f service-reservations/Dockerfile .
    - docker push $IMAGE_REGISTRY/service-reservations:$IMAGE_TAG

# --- Tâche 4 : Build API-Gateway ---
build-api-gateway:
  stage: build-and-push
  image: docker:24-git
  services:
    - docker:24-dind
  script:
    - docker build -t $IMAGE_REGISTRY/api-gateway:$IMAGE_TAG -f api-gateway/Dockerfile .
    - docker push $IMAGE_REGISTRY/api-gateway:$IMAGE_TAG

# --- Tâche 5 : Build Frontend-React ---
build-frontend-react:
  stage: build-and-push
  image: docker:24-git
  services:
    - docker:24-dind
  script:
    - docker build -t $IMAGE_REGISTRY/frontend-react:$IMAGE_TAG -f frontend-react/Dockerfile .
    - docker push $IMAGE_REGISTRY/frontend-react:$IMAGE_TAG

#
# --- TÂCHE DE DÉPLOIEMENT CORRIGÉE ---
#
deploy-to-k8s:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      
  before_script:
    - apk add --no-cache openssh-client rsync bash sed
    - apk add --no-cache kubectl
    - chmod 600 $SSH_PRIVATE_KEY
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $AWS_SERVER_IP >> ~/.ssh/known_hosts

  script:
    - echo "Déploiement sur K3s..."
    
    # --- Étape A: Remplacer les placeholders ---
    - sed -i "s@REGISTRE_PLACEHOLDER@$IMAGE_REGISTRY@g" k8s/deployment.yaml
    - sed -i "s@TAG_PLACEHOLDER@$IMAGE_TAG@g" k8s/deployment.yaml
    
    # --- Étape B: Copier les fichiers (inchangé) ---
    - scp -i $SSH_PRIVATE_KEY -r ./k8s $SSH_USER_IP:~/
    
    # --- Étape C: Se connecter et déployer ---
    - |
      ssh -i $SSH_PRIVATE_KEY $SSH_USER_IP << EOF
        
        echo "1. Création du secret pour le registre GitLab..."
        sudo k3s kubectl delete secret gitlab-registry-creds --ignore-not-found
        sudo k3s kubectl create secret docker-registry gitlab-registry-creds \
          --docker-server="$CI_REGISTRY" \
          --docker-username="$DEPLOY_REGISTRY_USER" \
          --docker-password="$DEPLOY_REGISTRY_PASS"
          
        echo "2. Application des configs (Issuer, Redirect)..."
        # CES LIGNES SONT LES PLUS IMPORTANTES
        sudo k3s kubectl apply -f k8s/issuer.yaml
        sudo k3s kubectl apply -f k8s/redirect-https.yaml

        echo "3. Application des déploiements..."
        sudo k3s kubectl apply -f k8s/deployment.yaml
        
        echo "4. Application de l'ingress..."
        sudo k3s kubectl apply -f k8s/ingress.yaml
        
        echo "Déploiement terminé !"
      EOF